
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <h1>Multiplication Table Generator</h1>

    <form method="POST">
        <label>Enter a number:</label>
        <input type="number" name="number" id="number" required>
        <button type="submit" id="generate">Generate Table</button>
    </form>

    {% if table %}
        <h2 id="result">Table of {{ number }}</h2>
        <ul id="table">
            {% for value in table %}
                <li>{{ number }} × {{ loop.index }} = {{ value }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
